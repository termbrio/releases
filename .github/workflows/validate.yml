name: Validate release catalog

on:
  push:
    branches:
      - dev
      - main
      - automation/**
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate catalog
        run: node scripts/validate-catalog.mjs
