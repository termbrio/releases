name: Project release catalog

on:
  workflow_dispatch:
    inputs:
      payload:
        description: JSON release event payload
        required: true
        type: string
      dispatch_website:
        description: Send the projected catalog to termbrio/website
        required: false
        default: false
        type: boolean
      persist_catalog:
        description: Commit the projected catalog to the selected branch
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - termbrio-release

permissions:
  contents: write

concurrency:
  group: release-catalog
  cancel-in-progress: false

jobs:
  project:
    name: Validate and project release event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAYLOAD_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.payload }}
      PERSIST_CATALOG: ${{ github.event_name == 'repository_dispatch' || inputs.persist_catalog }}

    steps:
      - name: Check out release ledger
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Materialize untrusted event payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(process.env.PAYLOAD_JSON);
            fs.writeFileSync(
              "out/event.json",
              `${JSON.stringify(payload, null, 2)}\n`,
              "utf8");
          '

      - name: Project candidate catalog and changelog
        run: >-
          node scripts/project-release-event.mjs
          --payload out/event.json
          --catalog catalog/latest.json
          --output out/catalog/latest.json
          --changelog catalog/changelog.json
          --changelog-output out/catalog/changelog.json

      - name: Persist candidate ledger
        if: ${{ env.PERSIST_CATALOG == 'true' }}
        id: persist-catalog
        shell: bash
        run: |
          set -euo pipefail
          cp out/catalog/latest.json catalog/latest.json
          cp out/catalog/changelog.json catalog/changelog.json

          changed=false
          if ! git diff --quiet -- catalog/latest.json catalog/changelog.json; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog/latest.json catalog/changelog.json
            git commit -m "Update release ledger"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            changed=true
          fi

          {
            echo "changed=$changed"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build website catalog event
        shell: bash
        env:
          RELEASE_SOURCE_REVISION: ${{ steps.persist-catalog.outputs.revision || github.sha }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const catalog = JSON.parse(
              fs.readFileSync("out/catalog/latest.json", "utf8"));
            const changelog = JSON.parse(
              fs.readFileSync("out/catalog/changelog.json", "utf8"));
            const event = {
              schemaVersion: 1,
              sourceRepository: "termbrio/releases",
              sourceRevision: process.env.RELEASE_SOURCE_REVISION,
              catalog,
              changelog
            };
            fs.writeFileSync(
              "out/catalog-event.json",
              `${JSON.stringify(event, null, 2)}\n`,
              "utf8");
          '

      - name: Create website App token
        if: ${{ github.event_name == 'repository_dispatch' || inputs.dispatch_website }}
        id: website-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TERMBRIO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TERMBRIO_RELEASE_APP_PRIVATE_KEY }}
          owner: termbrio
          repositories: website

      - name: Dispatch validated catalog event
        if: ${{ github.event_name == 'repository_dispatch' || inputs.dispatch_website }}
        uses: actions/github-script@v9
        env:
          CATALOG_EVENT_PATH: ./out/catalog-event.json
        with:
          github-token: ${{ steps.website-app-token.outputs.token }}
          script: |
            const fs = require("node:fs");
            const clientPayload = JSON.parse(
              fs.readFileSync(process.env.CATALOG_EVENT_PATH, "utf8"));

            await github.request(
              "POST /repos/{owner}/{repo}/dispatches",
              {
                owner: "termbrio",
                repo: "website",
                event_type: "termbrio-catalog",
                client_payload: clientPayload
              });

      - name: Upload projection evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-event-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 3

      - name: Summarize projection
        shell: bash
        run: |
          {
            echo "## Release ledger projection"
            echo
            echo "- Catalog persistence: $PERSIST_CATALOG"
            echo "- Website dispatch: ${{ github.event_name == 'repository_dispatch' || inputs.dispatch_website }}"
            echo "- Changelog projection: catalog/changelog.json"
            echo "- GitHub Release publication: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
